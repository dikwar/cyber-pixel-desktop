name: Rakit Aplikasi Desktop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Alat Rakit
        run: npm install

      - name: Buat File EXE
        run: npm run build:win

      - name: Simpan Hasil EXE
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-CyberPixelOS
          path: dist/*.exe
